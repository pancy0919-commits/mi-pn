<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>三原色文字疊層加密</title>
<style>
  body {
    background-color: #000000;
    color: #cccccc;
    font-family: "Microsoft JhengHei", sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
  }
  .box {
    display: flex;
    align-items: center;
    gap: 25px;
    border: 1px solid #333;
    padding: 25px;
    background-color: #0a0a0a;
  }
  canvas {
    border: 1px solid #444;
    background-color: #000000;
  }
  .btn-group {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  button {
    background-color: #1a1a1a;
    color: #eeeeee;
    border: 1px solid #555;
    padding: 12px 20px;
    font-size: 16px;
    cursor: pointer;
  }
  button:hover {
    background-color: #333333;
  }
</style>
</head>
<body>

<div class="box">
  <!-- 純文字重疊畫布（絕無任何色塊圓圈） -->
  <canvas id="textCanvas" width="480" height="160"></canvas>

  <!-- 右側純文字按鍵（絕無 RGB 英文字母） -->
  <div class="btn-group">
    <button onclick="showLayer('RED')">過濾第一組訊號</button>
    <button onclick="showLayer('GREEN')">過濾第二組訊號</button>
    <button onclick="showLayer('BLUE')">過濾第三組訊號</button>
    <button onclick="showLayer('ALL')">顯示全部重疊</button>
  </div>
</div>

<script>
  const canvas = document.getElementById('textCanvas');
  const ctx = canvas.getContext('2d');

  // 你要疊在一起的三串文字（直接改引號裡的字即可）
  const str1 = "第一串秘密：密碼是 8492";
  const str2 = "第二串秘密：鑰匙在抽屜裡";
  const str3 = "第三串秘密：快去檢查電腦";

  function showLayer(mode) {
    // 每次重畫前先清空成純黑背景
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#000000';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // 開啟光學色光疊加模式（紅+綠=黃、三色重疊=白）
    ctx.globalCompositeOperation = 'lighter';
    ctx.font = 'bold 36px "Microsoft JhengHei", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    // 只要符合條件，就只畫出對應的純 R、純 G 或純 B 文字
    if (mode === 'ALL' || mode === 'RED') {
      ctx.fillStyle = 'rgb(255, 0, 0)'; // 100% 純紅
      ctx.fillText(str1, 240, 78);
    }
    if (mode === 'ALL' || mode === 'GREEN') {
      ctx.fillStyle = 'rgb(0, 255, 0)'; // 100% 純綠
      ctx.fillText(str2, 240, 80);
    }
    if (mode === 'ALL' || mode === 'BLUE') {
      ctx.fillStyle = 'rgb(0, 0, 255)'; // 100% 純藍
      ctx.fillText(str3, 240, 82);
    }
  }

  // 網頁一打開，預設讓三串文字全部疊在一起
  showLayer('ALL');
</script>

</body>
</html>
